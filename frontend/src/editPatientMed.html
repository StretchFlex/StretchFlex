<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Patient Medical Information</title>
    <link rel="stylesheet" href="css/createPatientStyles.css">
    <link rel="stylesheet" href="css/universalStyles.css">
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css">
</head>
<body>
    <h2>Edit Patient Medical Information</h2>
    <p>Edit existing patient medical details and save any changes.</p>

    <form id="patientMedicalInfoForm"></form>
    <button class="finishButton" id="updateMedicalBtn">Update Medical Information</button>

<script src="js/auth.js"></script>
<script>
    if (!isAuthenticated()) {
        window.location.href = 'index.html';
    } else if (getUserRole() !== 'admin') {
        alert('Access denied. Only administrators can edit patient medical information.');
        window.location.href = 'selectPatient.html';
    }
</script>
<script src="js/bootstrap/bootstrap.bundle.min.js"></script>
<script src="js/editPatientMedScript.js"></script>
</body>
</html>
