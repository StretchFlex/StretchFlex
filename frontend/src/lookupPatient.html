<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lookup Patient</title>
	<link rel="stylesheet" href="css/lookupPatientStyles.css">
    <link rel="stylesheet" href="css/universalStyles.css">

</head>
<body>
    <h2 class="patient-heading">Lookup Patient ID</h2>

<div class="patient-select">
    <label for="firstNameInput">First Name</label>
    <input id="firstNameInput" name="firstName" placeholder="Type here..." autocomplete="off">
</div>

<div class="patient-select">
    <label for="lastNameInput">Last Name</label>
    <input id="lastNameInput" name="lastName" placeholder="Type here..." autocomplete="off">
</div>

<button class="goButton" id="lookupGoBtn">Go</button>


<script src="js/auth.js"></script>
<script>
    if (!isAuthenticated()) {
        window.location.href = 'index.html';
    }
</script>
<script src="js/lookupPatientScript.js"></script>
</body>
</html>
