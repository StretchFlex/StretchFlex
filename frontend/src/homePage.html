<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StretchFlex</title>
    <link rel="icon" type="image/png" href="assets/images/StretchFlex Favicon.png">
	<link rel="stylesheet" href="css/homePageStyles.css">
    <link rel="stylesheet" href="css/universalStyles.css">    

</head>
<body>


        <h1 class="gradient-text">StretchFlex</h1>

        <div class="top-bar">
            <button class="back-btn" id="backBtn">⬅ Back</button>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>


<!-- Iframe embedding another HTML document -->
    <iframe id="homePageIframe" 
        title="Select Patient"
        loading="lazy"
        referrerpolicy="no-referrer">
    </iframe>

<script src="js/auth.js"></script>
<script src="js/rbac.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var iframe = document.getElementById('homePageIframe');
        
        if (!isAuthenticated()) {
            window.location.href = 'index.html';
            return;
        }
        
        iframe.src = 'selectPatient.html';
    });
</script>
<script src="js/homePageScript.js"></script>

</body>
</html>
